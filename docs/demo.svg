<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description" fill="#eef4ff">
  <title id="title">swarm-it: one goal, a team of Claude and Codex workers</title>
  <desc id="description">An animated workflow illustration. A coordinator plans work, sends implementation to Codex, review to Claude, and tests to Codex. A Swarm rail tracks approval requests and results.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1220"/><stop offset="1" stop-color="#111b2c"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#75e0c2"/><stop offset="1" stop-color="#8eb4ff"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .small { fill:#95a7bf; font-size:17px; }
      .label { fill:#86e2c8; font-size:14px; font-weight:700; letter-spacing:2px; }
      .card { fill:#142238; stroke:#344864; stroke-width:2; }
      .line { fill:none; stroke:#344e68; stroke-width:3; stroke-linecap:round; }
      .pulse { animation:pulse 2.8s ease-in-out infinite; transform-origin:center; }
      .pulse2 { animation:pulse 2.8s ease-in-out .6s infinite; transform-origin:center; }
      .pulse3 { animation:pulse 2.8s ease-in-out 1.2s infinite; transform-origin:center; }
      .dash { stroke-dasharray:8 12; animation:flow 3s linear infinite; }
      .reveal { animation:reveal 6s ease-in-out infinite; }
      .reveal2 { animation:reveal 6s ease-in-out 1.5s infinite; }
      .reveal3 { animation:reveal 6s ease-in-out 3s infinite; }
      @keyframes pulse { 0%,100% { opacity:.45; } 50% { opacity:1; } }
      @keyframes flow { to { stroke-dashoffset:-40; } }
      @keyframes reveal { 0%,12%,82%,100% { opacity:.5; } 24%,70% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) { .pulse,.pulse2,.pulse3,.dash,.reveal,.reveal2,.reveal3 { animation:none; } }
    </style>
  </defs>
  <rect width="1200" height="630" rx="28" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="628" rx="27" fill="none" stroke="#2a3d56" stroke-width="2"/>
  <circle cx="55" cy="53" r="9" fill="#80e7c7"/><circle cx="80" cy="53" r="9" fill="#6d9ee9"/><circle cx="105" cy="53" r="9" fill="#e5b677"/>
  <text x="145" y="62" font-size="35" font-weight="800">swarm-it</text>
  <text x="1138" y="58" text-anchor="end" class="small">inside Kelpi</text>
  <text x="60" y="125" font-size="47" font-weight="800">One goal. Two CLIs. A whole team.</text>
  <text x="60" y="163" class="small">Say “swarm it” — plan, delegate, review, and keep the work moving.</text>

  <path d="M366 318 H455 M750 318 H830 M455 318 V398 M750 318 V398" class="line"/>
  <path d="M366 318 H455 M750 318 H830" class="line dash" stroke="#79dcc1"/>
  <rect x="50" y="224" width="320" height="208" rx="20" class="card"/>
  <rect x="68" y="242" width="116" height="28" rx="14" fill="#173f43"/>
  <text x="126" y="261" text-anchor="middle" class="label" font-size="12">COORDINATOR</text>
  <text x="72" y="318" font-size="28" font-weight="700">“Swarm it”</text>
  <text x="72" y="352" class="small">Break down the goal.</text>
  <text x="72" y="381" class="small">Choose who builds and reviews.</text>
  <circle cx="343" cy="251" r="7" fill="#7be7c8" filter="url(#glow)" class="pulse"/>

  <rect x="455" y="224" width="295" height="208" rx="20" class="card"/>
  <text x="478" y="260" class="label">SWARM RAIL</text>
  <rect x="477" y="281" width="249" height="37" rx="9" fill="#2d2a25" stroke="#947942"/>
  <circle cx="496" cy="299" r="5" fill="#e7b75c" class="pulse2"/>
  <text x="510" y="305" font-size="16">Needs you  ·  1</text>
  <rect x="477" y="326" width="249" height="37" rx="9" fill="#1d3440" stroke="#32685f"/>
  <circle cx="496" cy="345" r="5" fill="#83e9c5" class="pulse"/>
  <text x="510" y="351" font-size="16">Running  ·  2</text>
  <rect x="477" y="371" width="249" height="37" rx="9" fill="#243148" stroke="#4c6489"/>
  <circle cx="496" cy="389" r="5" fill="#8fb6ff" class="pulse3"/>
  <text x="510" y="395" font-size="16">Done  ·  1</text>

  <rect x="828" y="213" width="321" height="69" rx="15" class="card reveal"/>
  <rect x="846" y="231" width="78" height="30" rx="15" fill="#22405a"/>
  <text x="885" y="251" text-anchor="middle" font-size="14" font-weight="700" fill="#9acaff">CODEX</text>
  <text x="940" y="241" font-size="16" font-weight="700">Implement</text>
  <text x="940" y="263" font-size="13" fill="#9aabc0">write the change</text>
  <rect x="828" y="294" width="321" height="69" rx="15" class="card reveal2"/>
  <rect x="846" y="312" width="82" height="30" rx="15" fill="#4b342d"/>
  <text x="887" y="332" text-anchor="middle" font-size="14" font-weight="700" fill="#ffbd8a">CLAUDE</text>
  <text x="940" y="322" font-size="16" font-weight="700">Review</text>
  <text x="940" y="344" font-size="13" fill="#9aabc0">inspect the diff</text>
  <rect x="828" y="375" width="321" height="69" rx="15" class="card reveal3"/>
  <rect x="846" y="393" width="78" height="30" rx="15" fill="#22405a"/>
  <text x="885" y="413" text-anchor="middle" font-size="14" font-weight="700" fill="#9acaff">CODEX</text>
  <text x="940" y="403" font-size="16" font-weight="700">Verify</text>
  <text x="940" y="425" font-size="13" fill="#9aabc0">fix, test, report</text>

  <path d="M60 496 H1140" stroke="#2d4057"/>
  <text x="60" y="542" font-size="21" font-weight="700">Approval requests, in one rail</text>
  <text x="60" y="572" class="small">Claude: approve or deny  ·  Codex: jump to its native prompt</text>
  <text x="1140" y="542" text-anchor="end" font-size="21" font-weight="700">Hand off and keep going ↗</text>
  <text x="1140" y="572" text-anchor="end" class="small">Move the goal between Claude and Codex</text>
</svg>
