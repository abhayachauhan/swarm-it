<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="455" viewBox="0 0 1200 455" role="img" aria-labelledby="title description">
  <title id="title">One-click handoff between Claude and Codex in Kelpi</title>
  <desc id="description">Diagram showing a Claude or Codex pane, the Hand off to other CLI action, its exact local session transcript, and a new pane where the other CLI summarizes and continues the goal.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#172238"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#7bdcbe"/></marker></defs>
  <rect width="1200" height="455" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="453" rx="23" fill="none" stroke="#31435e" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="54" y="62" fill="#8de5ca" font-size="15" font-weight="800" letter-spacing="2">KEEP THE GOAL MOVING</text>
    <text x="54" y="111" fill="#f0f5ff" font-size="37" font-weight="800">Switch CLI without starting over.</text>
    <text x="54" y="149" fill="#a2b2c8" font-size="18">One pane action carries the source conversation into a fresh session with the other tool.</text>

    <rect x="54" y="201" width="260" height="162" rx="17" fill="#1d293d" stroke="#4c6682" stroke-width="2"/>
    <text x="78" y="241" fill="#eaf2ff" font-size="21" font-weight="700">Current pane</text>
    <rect x="78" y="257" width="92" height="30" rx="15" fill="#50382e"/><text x="124" y="278" text-anchor="middle" fill="#ffc89d" font-size="14" font-weight="800">CLAUDE</text>
    <text x="78" y="325" fill="#a2b2c8" font-size="16">Your live goal and decisions</text>

    <path d="M326 282 H426" stroke="#7bdcbe" stroke-width="3" marker-end="url(#arrow)"/>
    <rect x="439" y="218" width="318" height="128" rx="17" fill="#173c3c" stroke="#579d8f" stroke-width="2"/>
    <text x="598" y="259" text-anchor="middle" fill="#e7fff6" font-size="20" font-weight="700">Hand off to other CLI</text>
    <text x="598" y="290" text-anchor="middle" fill="#a8d9cf" font-size="15">Find exact session transcript</text>
    <text x="598" y="317" text-anchor="middle" fill="#a8d9cf" font-size="15">Open a new pane beside this one</text>
    <path d="M770 282 H860" stroke="#7bdcbe" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="875" y="201" width="270" height="162" rx="17" fill="#1d293d" stroke="#4c6682" stroke-width="2"/>
    <text x="899" y="241" fill="#eaf2ff" font-size="21" font-weight="700">New pane</text>
    <rect x="899" y="257" width="86" height="30" rx="15" fill="#24425d"/><text x="942" y="278" text-anchor="middle" fill="#add4ff" font-size="14" font-weight="800">CODEX</text>
    <text x="899" y="319" fill="#a2b2c8" font-size="16">Summarize, then continue</text>

    <text x="54" y="412" fill="#91a8c2" font-size="16">Works in either direction  ·  Same working directory  ·  Source closes after the target command is sent</text>
  </g>
</svg>
