<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title description">
  <title id="title">How Swarm-it handles Claude and Codex approval requests</title>
  <desc id="description">Illustration of the Swarm rail. A Claude request has Approve and Deny buttons after a fresh prompt check. A Codex request has Go to pane and is answered in Codex. Timed Auto applies only to eligible requests.</desc>
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0b1422"/><stop offset="1" stop-color="#172238"/></linearGradient></defs>
  <rect width="1200" height="510" rx="24" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="508" rx="23" fill="none" stroke="#31435e" stroke-width="2"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="52" y="66" fill="#8de5ca" font-size="15" font-weight="800" letter-spacing="2">ONE PLACE TO SEE WHAT NEEDS YOU</text>
    <text x="52" y="113" fill="#f0f5ff" font-size="36" font-weight="800">Approval requests stay visible.</text>
    <text x="52" y="148" fill="#a2b2c8" font-size="18">Each CLI keeps its own approval rules. Swarm-it gets you to the right decision.</text>

    <rect x="52" y="190" width="525" height="255" rx="18" fill="#18253a" stroke="#405573" stroke-width="2"/>
    <rect x="74" y="212" width="91" height="29" rx="14" fill="#51362e"/>
    <text x="119" y="232" text-anchor="middle" fill="#ffc398" font-size="14" font-weight="800">CLAUDE</text>
    <text x="183" y="233" fill="#eaf2ff" font-size="19" font-weight="700">Permission request</text>
    <rect x="74" y="263" width="480" height="60" rx="10" fill="#101a2b"/>
    <text x="91" y="289" fill="#9db4d0" font-size="14">Bash command</text>
    <text x="91" y="311" fill="#e9c774" font-family="ui-monospace,SFMono-Regular,monospace" font-size="17">npm run test:e2e</text>
    <rect x="74" y="346" width="107" height="40" rx="9" fill="#1d6b5d"/>
    <text x="128" y="372" text-anchor="middle" fill="#f2fff9" font-size="16" font-weight="700">Approve</text>
    <rect x="195" y="346" width="92" height="40" rx="9" fill="#2b3c55" stroke="#617797"/>
    <text x="241" y="372" text-anchor="middle" fill="#e5efff" font-size="16" font-weight="700">Deny</text>
    <text x="74" y="418" fill="#98a9c1" font-size="15">Checks the live prompt again before acting.</text>

    <rect x="623" y="190" width="525" height="255" rx="18" fill="#18253a" stroke="#405573" stroke-width="2"/>
    <rect x="645" y="212" width="84" height="29" rx="14" fill="#24425d"/>
    <text x="687" y="232" text-anchor="middle" fill="#a9d3ff" font-size="14" font-weight="800">CODEX</text>
    <text x="747" y="233" fill="#eaf2ff" font-size="19" font-weight="700">Approval request</text>
    <rect x="645" y="263" width="480" height="60" rx="10" fill="#101a2b"/>
    <text x="662" y="288" fill="#eaf2ff" font-size="17">Codex needs your approval</text>
    <text x="662" y="311" fill="#9db4d0" font-size="14">Native Codex menu is waiting in its pane</text>
    <rect x="645" y="346" width="151" height="40" rx="9" fill="#28527b"/>
    <text x="721" y="372" text-anchor="middle" fill="#f0f7ff" font-size="16" font-weight="700">Go to pane ↗</text>
    <text x="645" y="418" fill="#98a9c1" font-size="15">Answer the request in Codex itself.</text>
  </g>
</svg>
